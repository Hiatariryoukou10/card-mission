<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CARD MISSION</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#18202a;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
main{max-width:720px;margin:auto;padding:14px}h1{margin:5px 0}.sub,.small{color:#687384;font-size:13px}nav{display:flex;gap:7px;overflow:auto;margin:12px 0}
button{border:0;border-radius:12px;padding:12px 15px;font-weight:700;background:#e4e9f1;color:#26313d}button:disabled{opacity:.45}.active,.primary{background:#202b38;color:#fff}
.box{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}label{display:block;font-weight:700;margin:12px 0 7px}
input,select{width:100%;padding:13px;border:1px solid #ccd4df;border-radius:10px;font-size:16px;background:#fff}
.preview{width:100%;max-height:420px;object-fit:contain;margin-top:10px;border-radius:12px;display:none;background:#eee}
.hidden{display:none!important}.info{background:#eef7ff;border-left:4px solid #2563eb;padding:12px;border-radius:8px;margin:12px 0;font-size:13px}
.status{padding:10px;border-radius:10px;background:#eef2f7;margin-top:10px;font-size:13px}.ok{background:#ecfdf5;color:#047857}.warn{background:#fff7ed;color:#c2410c}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:8px}.progress>div{height:100%;width:0;background:#2563eb}
.cardno{background:#f8fafc;border-radius:12px;padding:12px;margin-top:12px}.cardno input{font-size:22px;font-weight:800;text-transform:uppercase}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid #e0e5ec;border-radius:14px;padding:8px}.item img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:9px}
.battle{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player{border:2px solid #e0e5ec;border-radius:12px;padding:9px;text-align:center;background:#f9fafc}.player img{width:100%;max-height:190px;object-fit:cover;border-radius:8px;margin:8px 0}
.hp{height:24px;background:#e0e5ec;border-radius:8px;overflow:hidden;margin:8px 0}.fill{height:100%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:12px;transition:.3s}
.log{background:#f0f5fa;border-radius:10px;padding:10px;margin:12px 0;max-height:210px;overflow:auto;font-size:13px}.entry{margin:5px 0;padding:6px;border-left:3px solid #10b981;background:#fff;border-radius:4px}
.winner{font-size:25px;font-weight:800;color:#10b981;margin:18px 0;text-align:center}
@media(max-width:500px){main{padding:10px}.battle{gap:7px}.player{padding:6px}}
</style>
</head>
<body>
<main>
<h1>⚡ CARD MISSION</h1>
<div class="sub">撮影 → カード番号認識 → データ取得 → 登録 → 二人対戦</div>
<nav>
<button class="active" onclick="tab('home',this)">ホーム</button>
<button onclick="tab('reg',this)">登録</button>
<button onclick="tab('list',this)">一覧</button>
<button onclick="tab('battle',this)">対戦 (<span id="count">0</span>)</button>
</nav>

<section id="home"><div class="box">
<h2>ようこそ！</h2>
<div class="info"><b>📷 自動カード認識</b><br>カード写真からOCRでカード番号を探し、カード番号でデータを取得します。OCRが間違っても番号を手入力して「再検索」できます。</div>
<p class="small">撮影は、カード番号が見えるように明るく・まっすぐ行ってください。</p>
</div></section>

<section id="reg" class="hidden"><div class="box">
<h2>📷 カード登録</h2>
<label>カード写真</label><input id="photo" type="file" accept="image/*" capture="environment">
<img id="preview" class="preview">
<div id="status" class="status hidden"><span id="statusText"></span><div class="progress"><div id="progress"></div></div></div>

<div id="cardNoBox" class="cardno hidden">
<div class="small">認識したカード番号（手入力で修正できます）</div>
<input id="cardNo" type="text" placeholder="例：VR04-039" autocomplete="off">
<button id="retryLookup" class="primary" style="width:100%;margin-top:8px">このカード番号で再検索</button>
<div id="sourceText" class="small"></div>
<div id="lookupResult" class="small"></div>
</div>

<label>カード名</label><input id="name" type="text" placeholder="例：仮面ライダーW サイクロンジョーカーエクストリーム">
<div class="stats">
<div><label>🔴 コウゲキ</label><input id="attack" type="number" min="1"></div>
<div><label>🔵 ボウギョ</label><input id="defense" type="number" min="1"></div>
<div><label>🟡 タイリョク</label><input id="hp" type="number" min="1"></div>
<div><label>🟢 スピードレベル</label><input id="speed" type="number" min="1" max="10"></div>
<div><label>⚡ 必殺</label><input id="special" type="number" min="1"></div>
</div>
<p class="small">自動取得できない項目だけ手動修正できます。</p>
<button id="save" class="primary" style="width:100%">登録する</button>
<button id="clear" style="width:100%;margin-top:8px">クリア</button>
<p id="msg" class="small"></p>
<details id="debugBox" class="hidden"><summary>OCR結果を見る</summary><pre id="rawOcr" style="white-space:pre-wrap;font-size:11px"></pre></details>
</div></section>

<section id="list" class="hidden"><div class="box"><h2>カード一覧</h2><div id="cards" class="grid"></div><p id="empty" class="small">まだカードがありません</p></div></section>

<section id="battle" class="hidden"><div class="box"><h2>⚔️ 二人対戦</h2>
<div id="battleSetup">
<label>プレイヤー1</label><select id="p1"></select>
<label>プレイヤー2</label><select id="p2"></select>
<button id="startBattle" class="primary" style="width:100%;padding:15px">対戦開始！</button>
</div>
<div id="battleArea" class="hidden">
<div id="turn" style="text-align:center;font-weight:800;background:#e0f2fe;padding:10px;border-radius:8px"></div>
<div id="screen" class="battle"></div><div id="log" class="log"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<button id="p1Btn" class="primary">P1 攻撃</button><button id="p2Btn" class="primary">P2 攻撃</button>
</div><div id="result"></div>
</div></div></section>
</main>

<script>
const KEY='cardMissionAutoV4';
let cards=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id);
const norm=s=>String(s||'').normalize('NFKC').replace(/[‐-‒–—−ー]/g,'-').replace(/\s+/g,'').toUpperCase()
 .replace(/^VRO(\d)/,'VR0$1').replace(/^VRI(\d)/,'VR1$1');
function tab(id,btn){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='battle')updateSelects();}
function status(t,k=''){ $('status').className='status '+k; $('status').classList.remove('hidden');$('statusText').textContent=t;}
function prog(n){$('progress').style.width=Math.max(0,Math.min(100,n))+'%';}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]);}

function cardNoCandidates(text){
 let t=norm(text).replace(/[OQ]/g,'0').replace(/[IL]/g,'1').replace(/S/g,'5');
 const out=[];
 const re=/\b(VR|GL|SC|CX|PVR|GBRC|PSC|PR|ST)[-]?\d{1,2}[-]?\d{2,3}\b/g;
 for(const m of t.matchAll(re)){
   const x=m[0].replace(/[^A-Z0-9]/g,'');
   const z=x.match(/^(VR|GL|SC|CX|PVR|GBRC|PSC|PR|ST)(\d{1,2})(\d{2,3})$/);
   if(z) out.push(z[1]+z[2].padStart(2,'0')+'-'+z[3].padStart(3,'0'));
 }
 return [...new Set(out)];
}

function numberAfter(text,label,min=1,max=99999){
 const i=text.indexOf(label); if(i<0)return null;
 const area=text.slice(i+label.length,i+180);
 const ms=area.match(/\d{1,2}(?:,\d{3})|\d{1,6}/g)||[];
 for(const m of ms){const n=parseInt(m.replace(/,/g,''),10);if(n>=min&&n<=max)return n;}
 return null;
}

function normalizeCardNo(v){
 let s=norm(v).replace(/[^A-Z0-9]/g,'');
 const m=s.match(/^(VR|GL|SC|CX|PVR|GBRC|PSC|PR|ST)(\d{1,2})(\d{2,3})$/);
 return m?m[1]+m[2].padStart(2,'0')+'-'+m[3].padStart(3,'0'):norm(v);
}

async function lookupCard(no){
 no=normalizeCardNo(no);
 const known={
  'VR04-039':{name:'仮面ライダーW サイクロンジョーカーエクストリーム',attack:2800,defense:2700,hp:2800,speed:3,special:5200}
 };
 if(known[no])return{cardNo:no,...known[no],source:'内蔵データ'};
 const url='https://www.ganbalegends-search.com/cards/'+encodeURIComponent(no);
 const res=await fetch('https://r.jina.ai/'+url,{cache:'no-store'});
 if(!res.ok)throw Error('検索失敗');
 const text=await res.text();
 const h=text.match(/^#\s+(.+?)\s*$/m);
 const name=h?h[1].trim():'';
 const attack=numberAfter(text,'コウゲキ',100,99999);
 const defense=numberAfter(text,'ボウギョ',100,99999);
 const hp=numberAfter(text,'タイリョク',100,99999);
 let speed=numberAfter(text,'スピード',1,10);
 if(speed==null)speed=numberAfter(text,'スピードレベル',1,10);
 const special=numberAfter(text,'ヒッサツ',100,99999);
 return{cardNo:no,name,attack,defense,hp,speed,special,source:'カード検索'};
}

async function lookupAndFill(no){
 no=normalizeCardNo(no); $('cardNo').value=no; status('🔎 '+no+' を検索しています…');prog(20);
 try{
  const d=await lookupCard(no);
  if(d.name)$('name').value=d.name;
  if(d.attack!=null)$('attack').value=d.attack;
  if(d.defense!=null)$('defense').value=d.defense;
  if(d.hp!=null)$('hp').value=d.hp;
  if(d.speed!=null)$('speed').value=d.speed;
  if(d.special!=null)$('special').value=d.special;
  const n=[d.name,d.attack,d.defense,d.hp,d.speed,d.special].filter(x=>x!==''&&x!=null).length;
  $('sourceText').textContent='取得元：'+d.source;
  $('lookupResult').textContent='✅ 自動取得：'+n+'/6項目';
  status(n>=5?'✅ データを取得しました。登録前に確認してください。':'⚠️ 一部を手動で確認してください。',n>=5?'ok':'warn');prog(100);
 }catch(e){console.error(e);status('⚠️ 自動検索できませんでした。番号と数値を確認してください。','warn');prog(100);}
}

async function preprocess(src,mode){
 return new Promise(resolve=>{
  const im=new Image();im.onload=()=>{
   const c=document.createElement('canvas'),ctx=c.getContext('2d');
   let sx=0,sy=0,sw=im.width,sh=im.height;
   if(mode==='bottom'){sy=Math.floor(im.height*.55);sh=Math.floor(im.height*.45);}
   const scale=Math.min(2.2,1800/Math.max(sw,sh));c.width=sw*scale;c.height=sh*scale;
   ctx.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);
   const d=ctx.getImageData(0,0,c.width,c.height);
   for(let i=0;i<d.data.length;i+=4){let g=(d.data[i]*.3+d.data[i+1]*.59+d.data[i+2]*.11);if(mode==='bottom')g=g>150?255:0;d.data[i]=d.data[i+1]=d.data[i+2]=g;}
   ctx.putImageData(d,0,0);resolve(c.toDataURL('image/jpeg',.9));
  };im.src=src;
 });
}

async function recognizeCard(src){
 status('📖 カード番号をOCR解析しています…');prog(5);
 try{
  const worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(typeof m.progress==='number')prog(5+m.progress*70)}});
  let texts=[];
  for(const mode of ['full','bottom']){
   const img=await preprocess(src,mode);
   const r=await worker.recognize(img);texts.push(r.data.text||'');
  }
  await worker.terminate();
  const text=texts.join('\n');$('rawOcr').textContent=text;$('debugBox').classList.remove('hidden');
  let cands=cardNoCandidates(text);
  if(!cands.length){
   const t=norm(text).replace(/O/g,'0').replace(/[IL]/g,'1');
   cands=cardNoCandidates(t);
  }
  $('cardNoBox').classList.remove('hidden');
  if(cands.length){$('cardNo').value=cands[0];await lookupAndFill(cands[0]);if(cands.length>1)$('sourceText').textContent+=' OCR候補：'+cands.join(' / ');}
  else{status('⚠️ カード番号を認識できませんでした。番号を手入力して「再検索」してください。','warn');prog(100);}
 }catch(e){console.error(e);status('⚠️ OCRに失敗しました。もう一度撮影してください。','warn');prog(100);}
}
$('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('preview').src=r.result;$('preview').style.display='block';recognizeCard(r.result)};r.readAsDataURL(f);};
$('retryLookup').onclick=()=>{const n=$('cardNo').value.trim();if(n)lookupAndFill(n);};
$('save').onclick=async()=>{
 const f=$('photo').files[0];const name=$('name').value.trim();if(!f){$('msg').textContent='写真を選んでください';return}if(!name){$('msg').textContent='カード名を入力してください';return}
 const vals=['attack','defense','hp','speed','special'].map(id=>parseInt($(id).value)||1);
 const src=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)});
 const im=await new Promise(ok=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,900/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};i.src=src});
 const [attack,defense,hp,speed,special]=vals;
 cards.push({id:Date.now(),name,cardNo:normalizeCardNo($('cardNo').value),img:im,attack,defense,hp,speed,special});
 localStorage.setItem(KEY,JSON.stringify(cards));render();resetForm();$('msg').textContent='✅ 登録しました！';
};
function resetForm(){$('photo').value='';$('name').value='';$('cardNo').value='';$('attack').value=2800;$('defense').value=2700;$('hp').value=2800;$('speed').value=3;$('special').value=5200;$('preview').style.display='none';$('status').classList.add('hidden');$('cardNoBox').classList.add('hidden');$('debugBox').classList.add('hidden');$('lookupResult').textContent='';$('sourceText').textContent='';prog(0);}
$('clear').onclick=()=>{resetForm();$('msg').textContent='';};
function del(id){if(confirm('このカードを削除しますか？')){cards=cards.filter(c=>c.id!==id);localStorage.setItem(KEY,JSON.stringify(cards));render();}}
function render(){$('count').textContent=cards.length;$('empty').style.display=cards.length?'none':'block';$('cards').innerHTML=cards.map(c=>`<div class="item"><img src="${c.img}"><b>${esc(c.name)}</b><br><small>🪪 ${esc(c.cardNo||'')}</small><br><small>🔴${c.attack} 🔵${c.defense} 🟡${c.hp} 🟢${c.speed} ⚡${c.special}</small><button onclick="del(${c.id})" style="width:100%;margin-top:8px">削除</button></div>`).join('');}
function updateSelects(){const opts=cards.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('p1').innerHTML=opts||'<option>カードがありません</option>';$('p2').innerHTML=opts||'<option>カードがありません</option>';if(cards.length>1)$('p2').selectedIndex=1;}

let battle={};
function start(){const a=cards.find(c=>c.id==$(`p1`).value),b=cards.find(c=>c.id==$(`p2`).value);if(!a||!b||a.id===b.id){alert('違うカードを選んでください');return}
 const hp1=Math.max(50,Math.round(a.hp/55)),hp2=Math.max(50,Math.round(b.hp/55));
 battle={p1:a,p2:b,hp1,hp2,maxHp1:hp1,maxHp2:hp2,round:1,acted:{},end:false,log:[]};
 $('battleSetup').classList.add('hidden');$('battleArea').classList.remove('hidden');$('p1Btn').disabled=false;$('p2Btn').disabled=false;$('result').innerHTML='';draw();$('turn').textContent='第1ターン';addlog('⚔️ 対戦開始！ 各ターンでP1・P2が1回ずつ攻撃します。最大5ターン。');}
function doAttack(who){
 if(battle.end)return;
 const a=who===1?battle.p1:battle.p2;const def=who===1?battle.p2:battle.p1;
 const special=Math.random()<.22;let base=special?a.special/105:a.attack/120;
 let damage=Math.max(2,Math.ceil(base*(.9+Math.random()*.2)*(1-Math.min(.35,def.defense/18000))));
 if(who===1)battle.hp2=Math.max(0,battle.hp2-damage);else battle.hp1=Math.max(0,battle.hp1-damage);
 addlog(`${a.name}${special?'の⚡必殺技！':'の攻撃！'} ${damage}ダメージ`);draw();
 if(battle.hp1<=0||battle.hp2<=0)finish();
}
function nextRound(who){
 if(battle.end)return;
 if(battle.acted && battle.acted[who])return;
 if(!battle.acted)battle.acted={};
 battle.acted[who]=true;
 doAttack(who);
 if(!battle.end && battle.acted[1] && battle.acted[2]){
   if(battle.round>=5){finish();return;}
   battle.round++;
   battle.acted={};
   $('p1Btn').disabled=false;
   $('p2Btn').disabled=false;
   $('turn').textContent=`第${battle.round}ターン`;
 }
}
function addlog(s){battle.log.push(s);$('log').innerHTML=battle.log.map(x=>`<div class="entry">${esc(x)}</div>`).join('');$('log').scrollTop=$('log').scrollHeight;}
function draw(){const a=100*battle.hp1/battle.maxHp1,b=100*battle.hp2/battle.maxHp2;$('screen').innerHTML=[['P1',battle.p1,battle.hp1,a],['P2',battle.p2,battle.hp2,b]].map(x=>`<div class="player"><b>${x[0]}</b><img src="${x[1].img}"><div><b>${esc(x[1].name)}</b></div><div class="hp"><div class="fill" style="width:${x[3]}%;background:${x[3]<25?'#ef4444':x[3]<50?'#f59e0b':'#10b981'}">${Math.ceil(x[2])}/${x[0]==='P1'?battle.maxHp1:battle.maxHp2}</div></div><small>🔴${x[1].attack} 🔵${x[1].defense} 🟢${x[1].speed} ⚡${x[1].special}</small></div>`).join('');$('turn').textContent=`第${battle.round}ターン`;}
function finish(){if(battle.end)return;battle.end=true;const winner=battle.hp1>battle.hp2?battle.p1:battle.p2;addlog(`🎉 ${winner.name}の勝利！`);$('result').innerHTML=`<div class="winner">🎉 ${esc(winner.name)} の勝利！</div><button class="primary" onclick="location.reload()" style="width:100%">もう一度</button>`;$('p1Btn').disabled=true;$('p2Btn').disabled=true;}
$('startBattle').onclick=start;$('p1Btn').onclick=()=>nextRound(1);$('p2Btn').onclick=()=>nextRound(2);
render();resetForm();
</script>
</body></html>
