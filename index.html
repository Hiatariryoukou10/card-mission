<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><title>CARD MISSION</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f7fb;margin:0;color:#18202a}
main{max-width:700px;margin:auto;padding:18px}h1{margin:5px 0}.sub{color:#687384;margin-bottom:15px}
nav{display:flex;gap:7px;overflow:auto;margin-bottom:12px}button{border:0;border-radius:12px;padding:12px 15px;font-weight:700;background:#e4e9f1;color:#26313d;cursor:pointer}
nav button.active,.primary{background:#202b38;color:white}.box{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}
label{display:block;font-weight:700;margin:12px 0 7px}input[type=text],input[type=number]{width:100%;padding:13px;border:1px solid #ccd4df;border-radius:10px;font-size:16px;box-sizing:border-box}
.preview{width:100%;max-height:360px;object-fit:contain;margin-top:10px;border-radius:12px;display:none;background:#eee}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{border:1px solid #e0e5ec;border-radius:14px;padding:8px}.item img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:9px}
.hidden{display:none}.small{font-size:13px;color:#687384}.danger{background:#fff0f0;color:#b42318}.result{font-size:25px;font-weight:800;margin-top:12px}
.battle-screen{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px}
.player{border:2px solid #e0e5ec;border-radius:12px;padding:15px;text-align:center;background:#f9fafc}
.player h3{margin:0 0 10px;font-size:16px}.player img{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin:10px 0}
.hp-bar{width:100%;height:24px;background:#e0e5ec;border-radius:8px;overflow:hidden;margin:10px 0}
.hp-fill{height:100%;background:#10b981;transition:width .3s ease;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:12px}
.hp-fill.warn{background:#f59e0b}.hp-fill.danger{background:#ef4444}
.battle-log{background:#f0f5fa;border-radius:10px;padding:12px;margin:15px 0;min-height:80px;max-height:200px;overflow-y:auto;font-size:13px}
.log-entry{margin:6px 0;padding:6px;border-left:3px solid #10b981;background:white;border-radius:4px}
.log-entry.damage{border-left-color:#ef4444}.log-entry.crit{border-left-color:#f59e0b;font-weight:700}
.effect{position:fixed;pointer-events:none;font-weight:700;font-size:24px;animation:float 1.5s ease-out forwards;z-index:9999}
@keyframes float{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}
.effect.damage{color:#ef4444}.effect.crit{color:#f59e0b;text-shadow:0 0 10px #f59e0b}
.winner{font-size:28px;font-weight:800;color:#10b981;margin:20px 0}
select{width:100%;padding:12px;border-radius:10px;border:1px solid #ccd4df;margin-bottom:12px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-input{display:flex;flex-direction:column}.stat-input label{margin:0 0 5px;font-size:12px;font-weight:600}
.turn-indicator{text-align:center;padding:10px;background:#e0f2fe;border-radius:8px;margin-bottom:15px;font-weight:700;color:#0369a1}
.info-box{background:#f0f9ff;border-left:4px solid #3b82f6;padding:10px;border-radius:6px;margin:12px 0;font-size:12px}
</style></head><body><main>
<h1>⚡ CARD MISSION</h1><div class="sub">5つのステータスで対戦！</div>
<nav><button class="active" onclick="tab('home',this)">ホーム</button><button onclick="tab('reg',this)">登録</button><button onclick="tab('list',this)">一覧</button><button onclick="tab('battle',this)">対戦 (<span id="count">0</span>)</button></nav>

<section id="home"><div class="box"><h2>ようこそ！</h2>
<div class="info-box">
<strong>📊 ステータス説明：</strong><br>
🔴 <b>コウゲキ</b> = 攻撃力（1-20）<br>
🔵 <b>ボウギョ</b> = 防御力（1-20）<br>
🟡 <b>タイリョク</b> = 体力（10-100）<br>
🟢 <b>スピードレベル</b> = 速さ（1-20）<br>
⚡ <b>必殺技攻撃力</b> = 特殊攻撃（1-50）
</div>
<p>カード写真を撮影 → ステータスを入力 → 登録 → 対戦！</p>
</div></section>

<section id="reg" class="hidden"><div class="box"><h2>カード登録</h2>
<label>写真</label><input id="photo" type="file" accept="image/*" capture="environment">
<img id="preview" class="preview">
<label>カード名</label><input id="name" type="text" placeholder="例：仮面ライダーゼッツ">
<div class="stats-grid">
<div class="stat-input"><label>🔴 コウゲキ</label><input id="attack" type="number" min="1" max="20" value="10"></div>
<div class="stat-input"><label>🔵 ボウギョ</label><input id="defense" type="number" min="1" max="20" value="5"></div>
<div class="stat-input"><label>🟡 タイリョク</label><input id="hp" type="number" min="10" max="100" value="50"></div>
<div class="stat-input"><label>🟢 スピード</label><input id="speed" type="number" min="1" max="20" value="10"></div>
<div class="stat-input"><label>⚡ 必殺技</label><input id="special" type="number" min="1" max="50" value="25"></div>
</div>
<br><button id="save" class="primary">登録する</button> <button id="clear" class="danger">クリア</button>
<p id="msg" class="small"></p>
</div></section>

<section id="list" class="hidden"><div class="box"><h2>カード一覧</h2><div id="cards" class="grid"></div><p id="empty" class="small">まだカードがありません</p></div></section>

<section id="battle" class="hidden"><div class="box"><h2>⚔️ 二人対戦</h2>
<div id="battleSetup">
<label>プレイヤー1</label><select id="p1"></select>
<label>プレイヤー2</label><select id="p2"></select>
<button id="startBattle" class="primary" style="width:100%;padding:15px">対戦開始！</button>
</div>
<div id="battleArea" class="hidden">
<div class="turn-indicator">ターン: <span id="turn">0</span></div>
<div class="battle-screen" id="screen"></div>
<div class="battle-log" id="log"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<button id="p1Btn" class="primary">攻撃</button>
<button id="p2Btn" class="primary">攻撃</button>
</div>
<div id="result"></div>
</div>
</div></section>

</main>
<script>
const KEY='cardMissionV7';
let cards=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id);

function tab(id,btn){
  document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));
  $(id).classList.remove('hidden');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(id==='battle')updateSelects();
}

$('photo').onchange=e=>{
  let f=e.target.files[0];
  if(!f)return;
  let r=new FileReader();
  r.onload=()=>{$('preview').src=r.result;$('preview').style.display='block'};
  r.readAsDataURL(f);
};

function compress(src){
  return new Promise(ok=>{
    let i=new Image;
    i.onload=()=>{
      let c=document.createElement('canvas');
      let s=Math.min(1,900/Math.max(i.width,i.height));
      c.width=i.width*s;c.height=i.height*s;
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);
      ok(c.toDataURL('image/jpeg',0.8));
    };
    i.src=src;
  });
}

$('save').onclick=async()=>{
  let f=$('photo').files[0];
  let n=$('name').value.trim();
  let a=parseInt($('attack').value)||10;
  let d=parseInt($('defense').value)||5;
  let h=parseInt($('hp').value)||50;
  let s=parseInt($('speed').value)||10;
  let sp=parseInt($('special').value)||25;
  
  if(!f){$('msg').textContent='写真を選んでください';return}
  if(!n){$('msg').textContent='名前を入力してください';return}
  
  $('msg').textContent='登録中...';
  let img=await compress(await new Promise(ok=>{
    let r=new FileReader();
    r.onload=()=>ok(r.result);
    r.readAsDataURL(f);
  }));
  
  cards.push({id:Date.now(),name:n,img,attack:a,defense:d,hp:h,speed:s,special:sp});
  localStorage.setItem(KEY,JSON.stringify(cards));
  
  $('photo').value='';
  $('name').value='';
  $('attack').value='10';
  $('defense').value='5';
  $('hp').value='50';
  $('speed').value='10';
  $('special').value='25';
  $('preview').style.display='none';
  $('msg').textContent='登録しました！';
  render();
};

$('clear').onclick=()=>{
  $('photo').value='';$('name').value='';
  $('attack').value='10';$('defense').value='5';$('hp').value='50';$('speed').value='10';$('special').value='25';
  $('preview').style.display='none';$('msg').textContent='';
};

function esc(s){return s.replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}

function render(){
  $('count').textContent=cards.length;
  $('empty').style.display=cards.length?'none':'block';
  $('cards').innerHTML=cards.map(c=>
    '<div class=\"item\"><img src=\"'+c.img+'\"><b>'+esc(c.name)+'</b><br><small>'+
    '🔴'+c.attack+' 🔵'+c.defense+' 🟡'+c.hp+' 🟢'+c.speed+' ⚡'+c.special+
    '</small><button onclick=\"del('+c.id+')\" class=\"danger\" style=\"width:100%;margin-top:8px;padding:8px\">削除</button></div>'
  ).join('');
}

function del(id){
  if(confirm('削除しますか？')){
    cards=cards.filter(c=>c.id!==id);
    localStorage.setItem(KEY,JSON.stringify(cards));
    render();
  }
}

function updateSelects(){
  if(!cards.length)return;
  let opts=cards.map(c=>'<option value=\"'+c.id+'\">'+esc(c.name)+'</option>').join('');
  $('p1').innerHTML=opts;
  $('p2').innerHTML=opts;
  if(cards.length>1)$('p2').selectedIndex=1;
}

let battle={p1:null,p2:null,hp1:0,hp2:0,turn:0,end:false,log:[]};

$('startBattle').onclick=()=>{
  let id1=$('p1').value,id2=$('p2').value;
  if(id1===id2){alert('違うカード選んで');return}
  let p1=cards.find(c=>c.id==id1);
  let p2=cards.find(c=>c.id==id2);
  battle={p1,p2,hp1:p1.hp,hp2:p2.hp,turn:0,end:false,log:[]};
  $('battleSetup').classList.add('hidden');
  $('battleArea').classList.remove('hidden');
  draw();
  log('対戦開始！');
};

function draw(){
  let{p1,p2,hp1,hp2}=battle;
  let pct1=Math.max(0,Math.min(100,hp1/p1.hp*100));
  let pct2=Math.max(0,Math.min(100,hp2/p2.hp*100));
  let col1=hp1<=p1.hp*0.25?'#ef4444':hp1<=p1.hp*0.5?'#f59e0b':'#10b981';
  let col2=hp2<=p2.hp*0.25?'#ef4444':hp2<=p2.hp*0.5?'#f59e0b':'#10b981';
  
  $('screen').innerHTML=`
    <div class="player">
      <h3>🟦 P1</h3>
      <img src="${p1.img}">
      <b>${esc(p1.name)}</b>
      <div class="hp-bar"><div class="hp-fill" style="width:${pct1}%;background:${col1}"><span>${Math.ceil(hp1)}/${p1.hp}</span></div></div>
      <small>🔴${p1.attack} 🔵${p1.defense} 🟢${p1.speed}</small>
    </div>
    <div class="player">
      <h3>🟥 P2</h3>
      <img src="${p2.img}">
      <b>${esc(p2.name)}</b>
      <div class="hp-bar"><div class="hp-fill" style="width:${pct2}%;background:${col2}"><span>${Math.ceil(hp2)}/${p2.hp}</span></div></div>
      <small>🔴${p2.attack} 🔵${p2.defense} 🟢${p2.speed}</small>
    </div>
  `;
  $('turn').textContent=battle.turn;
}

function log(msg){
  battle.log.push(msg);
  $('log').innerHTML=battle.log.map(m=>{
    let cls='log-entry';
    if(m.includes('ダメージ'))cls+=' damage';
    if(m.includes('必殺技'))cls+=' crit';
    return '<div class="'+cls+'">'+esc(m)+'</div>';
  }).join('');
  $('log').scrollTop=$('log').scrollHeight;
}

function effect(dmg,isCrit){
  let e=document.createElement('div');
  e.className='effect'+(isCrit?' crit':' damage');
  e.textContent=isCrit?'必殺技!':'-'+dmg;
  e.style.left=(window.innerWidth/2)+'px';
  e.style.top=(window.innerHeight/2)+'px';
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),1500);
}

function attack(attacker,defender){
  if(battle.end)return;
  
  let isCrit=Math.random()<0.25;
  let base=attacker.attack+Math.random()*3;
  let dmg=Math.max(1,Math.ceil(isCrit?attacker.special:base)*(1-defender.defense/50));
  
  if(attacker===battle.p1){
    battle.hp2=Math.max(0,battle.hp2-dmg);
    log(esc(attacker.name)+(isCrit?'の必殺技':'が攻撃')+'！'+dmg+'ダメージ！');
  }else{
    battle.hp1=Math.max(0,battle.hp1-dmg);
    log(esc(attacker.name)+(isCrit?'の必殺技':'が攻撃')+'！'+dmg+'ダメージ！');
  }
  effect(dmg,isCrit);
  battle.turn++;
  draw();
  
  if(battle.hp1<=0||battle.hp2<=0){
    battle.end=true;
    setTimeout(()=>{
      let winner=battle.hp1>0?battle.p1:battle.p2;
      log('🎉 '+esc(winner.name)+'の勝利！');
      $('result').innerHTML='<div class=\"winner\">🎉 '+esc(winner.name)+'の勝利！</div><button class=\"primary\" onclick=\"location.reload()\" style=\"width:100%;padding:12px;margin-top:15px\">もう一度</button>';
      $('p1Btn').disabled=true;
      $('p2Btn').disabled=true;
    },800);
  }
}

$('p1Btn').onclick=()=>attack(battle.p1,battle.p2);
$('p2Btn').onclick=()=>attack(battle.p2,battle.p1);

render();
</script></body></html>
